<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Color Collision</title>
	<link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Montserrat&amp;display=swap'>
	<link rel="stylesheet" href="./style.css">
	
</head>
<body>
	<div class="start-screen">
		<div class="game-data">
			<span class="name"><span>Color</span> <span>Collision</span></span>
		</div>
		<span class="info">
			<span class="highlight _1">FOCUS</span> is your weapon.
Don't make the wrong move.
Tap / click to swap the colors and save the central balls.
Because if the central balls don't survive, you <span class="highlight _2">DIE</span>.
Better play it <span class="highlight _3">SAFE</span> and push your score higher.
</span>
		<button class="btn play">PLAY</button>
	</div>
	
	<span class="retry-text hide" data-splitting>Game Over!</span>
	<button class="retry-btn hide" data-splitting>RETRY</button>
	<canvas data-canvas></canvas>
	
	
	
	<!-- partial -->
	  <script src='https://unpkg.com/splitting/dist/splitting.min.js'></script><script  src="./script.js"></script>
	
</body>
</html>
